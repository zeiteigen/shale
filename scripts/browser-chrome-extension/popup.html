<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shale Browser Ingestor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-area">
        <span class="logo-badge">SHALE</span>
        <h1>Browser Capture</h1>
      </div>
      <div id="connectionStatus" class="status-indicator checking">
        <span class="status-dot"></span>
        <span class="status-text">Checking...</span>
      </div>
    </header>

    <div id="feedbackBanner" class="feedback-banner hidden"></div>

    <!-- Delivery is shared by every module. -->
    <section class="card">
      <div class="card-header">
        <span class="card-title">Delivery</span>
      </div>
      <div id="deliverySummary" aria-live="polite"></div>
      <p id="deliveryError"></p>
      <button id="btnRetryFailed" class="btn btn-secondary">Retry failed records</button>
      <div id="jobList"></div>
    </section>

    <!-- One section per module contributed by a Shale extension (modules/popup-registry.js). -->
    <div id="modules"></div>

    <details class="card settings-card">
      <summary>Settings</summary>
      <div class="card-header">
        <span class="card-title">Connection & modules</span>
      </div>
      <div class="setting-item form-group">
        <label for="serverUrlInput" class="field-label">Shale Server Endpoint</label>
        <div class="input-with-button">
          <input type="text" id="serverUrlInput" class="text-input" placeholder="http://localhost:7425/ingest">
          <button id="btnSaveUrl" class="btn btn-sm">Save</button>
        </div>
      </div>
      <div id="moduleToggles"></div>
    </details>

    <footer class="footer">
      <span id="lastSyncLabel" class="last-sync">Last sync: Never</span>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
